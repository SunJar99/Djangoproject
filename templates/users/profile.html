{% extends 'base.html' %}
{% block content %}

<h1 class="text-center">Profile</h1>

<div class="container">
    <img src="{{ profile.avatar.url }}" alt="Profile Picture" style="width: 200px; height: 200px; border-radius: 50%;">
    <h2>{{ user.username }}</h2>
    <h3>{{ user.first_name }}</h3>
    <h3>{{ user.last_name }}</h3>
    <h3>{{ user.email }}</h3>
    <h3>Age: {{ profile.age }}</h3>
</div>

{% endblock %}
